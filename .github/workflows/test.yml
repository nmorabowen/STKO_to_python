name: Test

# Runs the unit + integration test suite under tests/ on every PR and on
# every push to main. Matrix-tests across the supported Python versions
# (3.11 / 3.12 / 3.13) declared in pyproject.toml.
#
# Plotting tests rely on matplotlib; MPLBACKEND=Agg keeps the headless
# runner from trying to open an interactive display.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      MPLBACKEND: Agg
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run pytest
        run: pytest tests/ -q

  viewer-extras:
    # Verifies the viewer optional extras resolve and import cleanly.
    # Runs the same smoke tests as the base matrix above plus the
    # extras-gated tests that the base matrix skips. Single Python
    # version is enough for a dep-resolution gate; the base matrix
    # already covers cross-version compatibility for the library core.
    name: Viewer extras resolve
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      # The extras are installed here, so the extras smoke tests must not
      # skip: with this set, a package that fails to resolve fails the job.
      STKO_REQUIRE_VIEWER_EXTRAS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with viewer + test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[viewer,test]"

      - name: Install headless GL stack (Xvfb + Mesa + libEGL)
        # VTK needs an OpenGL context to render, even with off_screen=True.
        # The runner has no X server, no libEGL and no libOSMesa, so VTK
        # fell through to an OSMesa window with no library behind it and
        # the first real render (PyVistaBackend.snapshot) segfaulted with
        # exit 139 from #92 on. xvfb and libgl1-mesa-dri are on the current
        # image; they are installed explicitly so the job does not depend
        # on it. libegl1 is not on the image: PySide6.QtGui links
        # libEGL.so.1, and without it `import pyvistaqt` raised ImportError,
        # which the Qt smoke test reported as "viewer extra not installed".
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libegl1

      - name: Run viewer smoke tests
        run: xvfb-run -a -s "-screen 0 1024x768x24" pytest tests/viewer/ -v -rs
