name: Test

# Runs the unit + integration test suite under tests/ on every PR and on
# every push to main. Matrix-tests across the supported Python versions
# (3.11 / 3.12 / 3.13) declared in pyproject.toml.
#
# Plotting tests rely on matplotlib; MPLBACKEND=Agg keeps the headless
# runner from trying to open an interactive display.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      MPLBACKEND: Agg
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run pytest
        run: pytest tests/ -q

  viewer-extras:
    # Verifies the viewer optional extras resolve and import cleanly.
    # Runs the same smoke tests as the base matrix above plus the
    # extras-gated tests that the base matrix skips. Single Python
    # version is enough for a dep-resolution gate; the base matrix
    # already covers cross-version compatibility for the library core.
    name: Viewer extras resolve
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with viewer + test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[viewer,test]"

      - name: "[diag] snapshot without a display (expected to crash)"
        continue-on-error: true
        run: |
          echo "DISPLAY='${DISPLAY:-}'"
          ldconfig -p | grep -E 'libGL\.so|libGLX|libEGL|libOSMesa|libgbm' || true
          ls /usr/lib/x86_64-linux-gnu/dri/ 2>/dev/null | head || echo "no DRI drivers"
          python -c "import vtk; rw = vtk.vtkRenderWindow(); print('VTK', vtk.vtkVersion.GetVTKVersion(), rw.GetClassName())"
          pytest "tests/viewer/backends/pyvista/test_backend.py::test_snapshot_returns_rgb_array" -v -p no:cacheprovider

      - name: Install headless GL stack (Xvfb + Mesa)
        # VTK needs an OpenGL context to render, even with off_screen=True.
        # The hosted Ubuntu runner has no X server, so the first real
        # render (PyVistaBackend.snapshot) segfaulted with exit 139 from
        # #92 on. Xvfb + Mesa's software rasterizer provide one.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri

      - name: "[diag] GL report under Xvfb"
        run: xvfb-run -a -s "-screen 0 1024x768x24" python -c "import pyvista as pv; print(pv.Report())"

      - name: Run viewer smoke tests
        run: xvfb-run -a -s "-screen 0 1024x768x24" pytest tests/viewer/ -v -rs
